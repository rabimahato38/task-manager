name: Task Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
      - name: Build Docker image
        run: docker build -t task-manager:ci .

      - name: Run Docker container
        run: docker run -d --name task-manager-ci -p 8000:8000 task-manager:ci

      - name: Test container
        run: curl --fail http://localhost:8000/health

      - name: Cleanup container
        if: always()
        run: docker rm -f task-manager-ci
