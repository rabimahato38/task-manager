name: Task Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t task-manager:ci .

      - name: Smoke test container
        run: |
          docker run -d --name task-manager-ci -p 8000:8000 task-manager:ci
          for i in {1..15}; do
            if curl --fail http://localhost:8000/health; then
              echo "App is ready"
              break
            fi
            echo "Waiting for app..."
            sleep 1
          done
          curl --fail http://localhost:8000/health
          docker rm -f task-manager-ci

